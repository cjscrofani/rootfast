name = "rootfast-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Keep the workers.dev fallback URL alive — useful as a stable
# immutable identifier and as a fallback during DNS/SSL transitions.
workers_dev = true

# Custom domain — provisioned via Cloudflare dashboard (Workers → rootfast-api
# → Settings → Triggers → Custom Domains). Declared here so a future deploy
# can't silently drop it; the `custom_domain = true` flag tells wrangler this
# is a managed subdomain (not a pattern-based route) on the rootfast.org zone.
[[routes]]
pattern        = "api.rootfast.org"
custom_domain  = true

# Cloudflare D1 binding. Create the database once via:
#     wrangler d1 create rootfast
# then paste the database_id below.
#
# Apply schema migrations from api/schema/ via:
#     wrangler d1 migrations apply rootfast
[[d1_databases]]
binding        = "DB"
database_name  = "rootfast"
database_id    = "bd850648-4b8f-4af7-8a73-e0a9a3c3b830"
migrations_dir = "schema"

[vars]
# Date-based, matching the `data-vYYYY.MM` release tags. Two uses:
#   * /healthz reports it when schema_meta has no `dataset_version` stamp
#     (the build stamps one — see api/scripts/populate_meta.sql).
#   * It is part of every cache key (with CACHE_EPOCH in src/index.ts), so
#     BUMP IT WHEN THE DATA CHANGES: otherwise answers cached at the edge from
#     the old data keep being served for up to a day.
DATASET_VERSION = "2026.05"

# Rows the API may read from D1 per UTC day. The Workers Free plan allows
# 5,000,000; 4,000,000 leaves a margin for usage other isolates have not
# reported yet and for queries run outside the Worker. Once spent, the API
# serves cached answers only and returns 503 `daily_budget_exhausted` for the
# rest until 00:00 UTC (see src/guard.ts). "0" disables the budget.
DAILY_ROWS_BUDGET = "4000000"

# --- Rate limiting (per-client-IP) -----------------------------------------
# Three Cloudflare-native rate-limit bindings, keyed by request IP. The 60s
# period is the only valid window for the simple ratelimit binding alongside
# the 10s window.
#
#   default — every /v1/* route that isn't covered by a more specific limiter
#   bulk    — `?format=csv` or `?format=ndjson` exports; small budget
#   search  — /v1/search; FTS5 queries
#
# Health-check, /v1/openapi.json, /v1/docs are intentionally NOT rate limited:
# they're cheap and frequently polled (/healthz reads D1 at most once a minute
# per isolate). Answers served from the edge cache are not counted either
# (they cost no D1 rows), and neither are the website's own calls over its
# service binding (see enforceRateLimit). POST /v1/plants/search (the plant
# finder) shares the bulk limiter under its own key. IPv6 clients are counted
# per /64.
#
# These limits bound one client. The total is bounded by DAILY_ROWS_BUDGET.

[[unsafe.bindings]]
name = "RATELIMIT_DEFAULT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RATELIMIT_BULK"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 2, period = 60 }

[[unsafe.bindings]]
name = "RATELIMIT_SEARCH"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 30, period = 60 }
