[project]
name = "rootfast"
version = "0.0.1"
description = "Native Plant Finder API — ETL pipeline that joins USDA PLANTS, USDA hardiness zones, Xerces pollinator data, and state extension data at the county level."
readme = "native-plant-finder-api.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.7",
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyarrow>=16.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "ruff>=0.5",
    "pytest>=8.2",
    "datamodel-code-generator>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootfast"]

[tool.ruff]
line-length = 100
target-version = "py311"
